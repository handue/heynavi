[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heynavi-backend"
version = "0.1.0"
description = "HeyNavi FastAPI backend: proxies the Meta Model API (sam-3.1, muse-spark-1.3) for the mobile app."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.setuptools]
packages = ["app", "app.meta", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Starlette 1.x prefers the httpx2 package for TestClient; plain httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
